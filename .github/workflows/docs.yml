name: Publish dbt docs

on:
  push:
    branches: [main]
  workflow_dispatch:      # also lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the project so the docs include real table stats
        run: |
          python scripts/generate_data.py --views 50000 --out data
          python scripts/load_raw.py --target duckdb
          dbt build

      - name: Generate a single-file static docs site
        run: |
          dbt docs generate --static
          mkdir -p site
          cp target/static_index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4