name: framewise_analytics
version: '1.0.0'
config-version: 2

profile: framewise_analytics #  must match the name in profiles.yml

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analysis"]

clean-targets: ["target", "dbt_packages"]

models:
  framewise_analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      +contract:
        enforced: true
      # Applied on Snowflake; DuckDB ignores grants (logs a notice)
      +grants:
        select: ["reporter"]
    utilities:
      +schema: marts
      +materialized: table

vars:
  # Days to re-process on each incremental run, to catch late-arriving events.
  incremental_lookback_days: 3
  dev_lookback_days: 30