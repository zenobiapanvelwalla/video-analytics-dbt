version: 2

sources:
  - name: platform
    description: Replicated tables from the production application database.
    schema: raw_platform
    config:
      loaded_at_field: "cast(_loaded_at as timestamp)"
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: customers
        description: One row per customer account.
        columns:
          - name: customer_id
            data_tests: [unique, not_null]
          - name: plan_changes
            description: Append only log of plan changes. First row per customer is their signup plan.
            config: 
              freshness: null # change log, not continuously loaded
          - name: video_assets
            description: One row per uploaded video.
  
  - name: player
    description: Playback sessions from the player SDK. At-least-once delivery, so expect duplicates.
    schema: raw_player
    config:
      loaded_at_field: "cast(_loaded_at as timestamp)"
      freshness:
        warn_after: {count: 1, period: hour}
        error_after: {count: 6, period: hour}
    tables:
      - name: video_views
        columns:
          - name: view_id
            data_tests: [not_null] # NOT unique here: deduplicated in staging

